manifestVersion: 1

plugin:
  id: com.example.dsh.ui-skin
  name: dsh ui skin
  version: 1.0.0
  description: >-
    DeepSeek Harness UI 皮肤插件：在 UI 下方注入静态壁纸（渐变/图片）与动态背景
    （Canvas 粒子/雨/星空/视频），通过设置页切换皮肤并调节透明度/模糊/遮罩/密度/速度。

runtime:
  harness:
    min: 0.1.0-rc.7
    max: "<0.2.0"

  node:
    min: 22
    max: "<25"

cordis:
  apiLevel: 1

capabilities:
  provides:
    - com.example.dsh.ui-skin.tool.skin_list
    - com.example.dsh.ui-skin.route.skins

  consumes:
    - ctx.tools
    - ctx.webServer

events:
  subscribes: []

  waterfall: []

permissions:
  filesystem:
    read: []
    write: []

  network:
    outbound: false
    hosts: []

  subprocess:
    enabled: false

  shell:
    enabled: false

  credentials:
    access: false

resources:
  maxRuntimeMs: 30000
  maxMemoryMb: 512
  maxOutputBytes: 1048576
  maxProcesses: 1
  maxConcurrentTasks: 8

lifecycle:
  unloadable: true
  reversible: true

session:
  modelVisibleState: false
  durableState: false

profiles:
  supported:
    - web

security:
  level: S1
  sandboxRequired: true

compatibility:
  apiLevelPolicy: strict
  breakingChangesPolicy: semver
